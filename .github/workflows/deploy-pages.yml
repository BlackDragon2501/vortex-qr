name: Deploy a GitHub Pages

# Deploy a GitHub Pages con el GITHUB_TOKEN interno: cero tokens externos,
# cero secrets, cero limites de proyectos. El build exporta estatico con
# basePath del repo (GITHUB_PAGES=1) y queda en
# https://blackdragon2501.github.io/<repo>/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install

      - name: Build (export estatico con basePath del repo)
        env:
          GITHUB_PAGES: "1"
        run: bun run build

      - name: Configurar Pages (crea el sitio si no existe)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
